name: TalentFlow CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Test Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Linter (Ruff Auto-Fix)
        run: ruff check . --fix --show-fixes

      - name: Run Django Unit Tests
        env:
          DEBUG: "True"
          SECRET_KEY: "test-secret-key-for-cicd-pipeline"
          DATABASE_URL: "sqlite:///db.sqlite3"
        run: python manage.py test

  deploy:
    name: Deploy to VPS Environment
    runs-on: ubuntu-latest
    needs: build-and-test
    # Bu job SADECE main branch'ine push (PR merge) yapıldığında çalışır
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS using rsync (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "~/TalentFlow"
          strip_components: 0

      - name: Execute Remote SSH commands (Migrate & Restart Server)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/TalentFlow
            
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            # Tmux içinde Django sunucusunu kesintisiz yeniden başlat
            tmux has-session -t talentflow 2>/dev/null
            if [ $? -eq 0 ]; then
              echo "Existing tmux session found. Restarting..."
              tmux send-keys -t talentflow:0 C-c Enter
              sleep 2
              tmux send-keys -t talentflow:0 "source .venv/bin/activate" Enter
              tmux send-keys -t talentflow:0 "python manage.py runserver 0.0.0.0:8000" Enter
            else
              echo "No active tmux session. Creating new session 'talentflow'..."
              tmux new-session -d -s talentflow "source .venv/bin/activate && python manage.py runserver 0.0.0.0:8000"
            fi
            
            echo "Deployment successfully completed!"
